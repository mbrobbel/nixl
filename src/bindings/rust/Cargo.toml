[package]
name = "nixl-sys"
description = "Low-level bindings to the nixl library"
links = "nixl"
build = "build.rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# Explicit package contents. `vendor/` (the bundled nixl C++ sources, populated
# by vendor-nixl.sh before publishing) is gitignored, so it is listed here to be
# included in the published crate for offline `build-from-source` builds.
include = [
    "build.rs",
    "wrapper.cpp",
    "wrapper.h",
    "stubs.cpp",
    "meson.build",
    "rust-toolchain.toml",
    "README.md",
    "src/**/*",
    "tests/**/*",
    "vendor/**/*",
]

[features]
stub-api = []
# Build the nixl C++ libraries from source with meson into OUT_DIR instead of
# linking an already-installed nixl. Takes precedence over `stub-api` if both
# are enabled (e.g. via feature unification).
build-from-source = []

[dependencies]
thiserror = { version = "2" }
tracing = { version = "0.1" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
libc = "0.2"

[build-dependencies]
bindgen = "0.71"
cc = { version = "1.2.23", features = ["parallel"] }
pkg-config = "0.3"
os_info = "3.11"
anyhow = "1"

[dev-dependencies]
tempfile = "3.20.0"
